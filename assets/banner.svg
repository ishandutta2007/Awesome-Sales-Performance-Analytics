<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Accent Glow Gradients -->
    <radialGradient id="glowCyan" cx="75%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    
    <radialGradient id="glowPurple" cx="25%" cy="70%" r="40%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.4"/>
    </pattern>

    <!-- Gradient for Dynamic Chart Line -->
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    
    <!-- Gradient for Fill area under chart -->
    <linearGradient id="chartAreaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Dynamic Pulse Keyframes -->
    <style>
      .pulse-circle {
        animation: pulse 3s infinite ease-in-out;
      }
      .dash-line {
        stroke-dasharray: 10, 10;
        animation: dash 30s linear infinite;
      }
      .float-pill {
        animation: float 4s ease-in-out infinite;
      }
      .glow-text {
        text-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
      }
      @keyframes pulse {
        0%, 100% { r: 6px; opacity: 0.8; }
        50% { r: 10px; opacity: 0.4; }
      }
      @keyframes dash {
        to { stroke-dashoffset: -1000; }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="340" fill="url(#bgGrad)" rx="16"/>
  <rect width="1200" height="340" fill="url(#grid)" rx="16"/>

  <!-- Radial Light Reflections in Background -->
  <circle cx="900" cy="100" r="300" fill="url(#glowCyan)"/>
  <circle cx="300" cy="240" r="300" fill="url(#glowPurple)"/>

  <!-- Dynamic / Animated Background Graphics (Behind Text) -->
  <!-- Animated Grid / Flow Lines -->
  <path d="M -50 260 Q 300 180, 600 250 T 1250 200" fill="none" stroke="url(#chartGrad)" stroke-width="2" class="dash-line" opacity="0.4"/>
  
  <!-- Dynamic Sales Growth Graph Silhouette (Bottom Right Background) -->
  <path d="M 650 270 L 720 230 L 790 245 L 870 190 L 950 210 L 1050 130 L 1150 150 L 1150 300 L 650 300 Z" fill="url(#chartAreaGrad)" opacity="0.7"/>
  <path d="M 650 270 L 720 230 L 790 245 L 870 190 L 950 210 L 1050 130 L 1150 150" fill="none" stroke="url(#chartGrad)" stroke-width="3.5" stroke-linecap="round"/>
  
  <!-- Pulsing Data Nodes on Graph -->
  <circle cx="720" cy="230" r="6" fill="#38bdf8" class="pulse-circle"/>
  <circle cx="870" cy="190" r="6" fill="#818cf8" class="pulse-circle"/>
  <circle cx="1050" cy="130" r="6" fill="#c084fc" class="pulse-circle"/>

  <!-- Decorative Pills / Tags in Background (Soft Floating) -->
  <g class="float-pill" opacity="0.6">
    <rect x="750" y="60" width="130" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="815" y="81" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">📈 Pipeline AI</text>
  </g>
  <g class="float-pill" style="animation-delay: -2s;" opacity="0.6">
    <rect x="940" y="80" width="150" height="32" rx="16" fill="#1e293b" stroke="#818cf8" stroke-width="1"/>
    <text x="1015" y="101" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🎯 Forecast Accuracy</text>
  </g>

  <!-- FOREGROUND CONTENT (Guaranteed High Contrast & Readability) -->
  <!-- Top Badge / Header Tag -->
  <g transform="translate(80, 55)">
    <rect x="0" y="0" width="240" height="30" rx="15" fill="#3b82f6" fill-opacity="0.2" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="120" y="19" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1" text-anchor="middle">CURATED AWESOME LIST</text>
  </g>

  <!-- Main Title -->
  <text x="80" y="145" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5" class="glow-text">
    Awesome Sales Performance Analytics 📊
  </text>

  <!-- Subtitle -->
  <text x="80" y="195" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400">
    Top Enterprise SaaS Platforms, Open-Source BI Dashboards &amp; Revenue Intelligence Tools
  </text>

  <!-- Bottom Feature Bullets / Highlights -->
  <g transform="translate(80, 245)">
    <!-- Bullet 1 -->
    <g transform="translate(0, 0)">
      <circle cx="12" cy="12" r="10" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.5"/>
      <path d="M 8 12 L 11 15 L 16 9" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
      <text x="32" y="17" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500">Pipeline Intelligence</text>
    </g>

    <!-- Bullet 2 -->
    <g transform="translate(210, 0)">
      <circle cx="12" cy="12" r="10" fill="#7c3aed" fill-opacity="0.3" stroke="#a78bfa" stroke-width="1.5"/>
      <path d="M 8 12 L 11 15 L 16 9" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round"/>
      <text x="32" y="17" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500">Revenue Forecasting</text>
    </g>

    <!-- Bullet 3 -->
    <g transform="translate(420, 0)">
      <circle cx="12" cy="12" r="10" fill="#059669" fill-opacity="0.3" stroke="#34d399" stroke-width="1.5"/>
      <path d="M 8 12 L 11 15 L 16 9" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>
      <text x="32" y="17" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500">Self-Hosted Sales BI</text>
    </g>
  </g>
</svg>
